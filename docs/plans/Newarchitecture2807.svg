<svg width="1400" height="1350" viewBox="0 0 1400 1350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="1350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0F0F13"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edge-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F38020" stop-opacity="0.1"/><stop offset="100%" stop-color="#F38020" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="policy-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="agentic-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.1"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="compliance-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F59E0B" stop-opacity="0.1"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="data-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22C55E" stop-opacity="0.1"/><stop offset="100%" stop-color="#22C55E" stop-opacity="0.02"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#717D96"/></marker>
  </defs>

  <rect width="1400" height="1350" fill="url(#bg)"/>

  <!-- Header -->
  <text x="700" y="50" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#FAFAFA" text-anchor="middle">ObserveID: World-Class IAM Architecture</text>
  <text x="700" y="78" font-family="Inter, sans-serif" font-size="14" fill="#717D96" text-anchor="middle">Graph-Native · Policy-as-Code · Agentic Identity Fabric</text>
  <line x1="100" y1="100" x2="1300" y2="100" stroke="#27272A" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════════
     PLANE 1: EDGE & ENTITY INGESTION
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Plane-1-Edge">
    <rect x="60" y="120" width="1280" height="120" rx="12" fill="url(#edge-grad)" stroke="#F38020" stroke-opacity="0.3" stroke-width="1"/>
    <text x="80" y="145" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#F38020" letter-spacing="1">PLANE 1: EDGE &amp; ENTITY INGESTION (UNTRUSTED ZONE)</text>
    
    <g filter="url(#shadow)">
      <rect x="120" y="165" width="280" height="60" rx="8" fill="url(#glass)" stroke="#F38020" stroke-opacity="0.4"/>
      <text x="135" y="185" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">SCIM 2.0 Gateway</text>
      <text x="135" y="202" font-family="Inter, sans-serif" font-size="10" fill="#717D96">Inbound HR Sync (Workday, BambooHR)</text>
      <text x="135" y="215" font-family="Inter, sans-serif" font-size="9" fill="#22C55E">Standards-Compliant Provisioning</text>
    </g>
    
    <g filter="url(#shadow)">
      <rect x="440" y="165" width="280" height="60" rx="8" fill="url(#glass)" stroke="#F38020" stroke-opacity="0.4"/>
      <text x="455" y="185" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">Cloudflare WAF &amp; API Gateway</text>
      <text x="455" y="202" font-family="Inter, sans-serif" font-size="10" fill="#717D96">gorilla/mux · DDoS Protection</text>
      <text x="455" y="215" font-family="Inter, sans-serif" font-size="9" fill="#22C55E">Strict JWT/JWKS Validation (No Headers)</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="760" y="165" width="280" height="60" rx="8" fill="url(#glass)" stroke="#F38020" stroke-opacity="0.4"/>
      <text x="775" y="185" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">Downstream SaaS &amp; Cloud</text>
      <text x="775" y="202" font-family="Inter, sans-serif" font-size="10" fill="#717D96">AWS · Slack · GitHub · Databases</text>
      <text x="775" y="215" font-family="Inter, sans-serif" font-size="9" fill="#717D96">Consumes CAEP Kill Events</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1080" y="165" width="200" height="60" rx="8" fill="url(#glass)" stroke="#F38020" stroke-opacity="0.4"/>
      <text x="1095" y="185" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">CISO Dashboard</text>
      <text x="1095" y="202" font-family="Inter, sans-serif" font-size="10" fill="#717D96">Next.js 14 (SSG)</text>
      <text x="1095" y="215" font-family="Inter, sans-serif" font-size="9" fill="#717D96">Tenant-Scoped UI</text>
    </g>
  </g>

  <!-- Flow Line -->
  <path d="M 700 240 L 700 280" stroke="#717D96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════════════════════════
     PLANE 2: POLICY & AUTHORIZATION (THE BRAIN)
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Plane-2-Policy">
    <rect x="60" y="280" width="1280" height="140" rx="12" fill="url(#policy-grad)" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="80" y="305" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#3B82F6" letter-spacing="1">PLANE 2: POLICY &amp; AUTHORIZATION (REAL-TIME AUTHZ)</text>

    <g filter="url(#shadow)">
      <rect x="120" y="325" width="380" height="80" rx="8" fill="url(#glass)" stroke="#3B82F6" stroke-opacity="0.5"/>
      <text x="135" y="345" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">AWS Cedar Policy Engine</text>
      <text x="135" y="365" font-family="JetBrains Mono, monospace" font-size="10" fill="#717D96">Policy-as-Code · Hot-Reload (30s)</text>
      <text x="135" y="385" font-family="Inter, sans-serif" font-size="9" fill="#14B8A6" font-weight="600">Contextual AuthZ (Time, Geo, Risk)</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="540" y="325" width="380" height="80" rx="8" fill="url(#glass)" stroke="#3B82F6" stroke-opacity="0.5"/>
      <text x="555" y="345" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">OIDC &amp; JIT Passport Mint</text>
      <text x="555" y="365" font-family="JetBrains Mono, monospace" font-size="10" fill="#717D96">RS256 Asymmetric Signing</text>
      <text x="555" y="385" font-family="Inter, sans-serif" font-size="9" fill="#14B8A6" font-weight="600">5-Min Ephemeral Tokens (Zero-Standing)</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="960" y="325" width="320" height="80" rx="8" fill="url(#glass)" stroke="#3B82F6" stroke-opacity="0.5"/>
      <text x="975" y="345" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">Identity Resolution</text>
      <text x="975" y="365" font-family="JetBrains Mono, monospace" font-size="10" fill="#717D96">Entity Stitching (Email + EmpID Hash)</text>
      <text x="975" y="385" font-family="Inter, sans-serif" font-size="9" fill="#14B8A6" font-weight="600">Unified Persona Graph Node</text>
    </g>
  </g>

  <!-- Flow Line -->
  <path d="M 700 420 L 700 460" stroke="#717D96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════════════════════════
     PLANE 3: AGENTIC GOVERNANCE (THE MOAT)
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Plane-3-Agentic">
    <rect x="60" y="460" width="1280" height="140" rx="12" fill="url(#agentic-grad)" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="80" y="485" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#8B5CF6" letter-spacing="1">PLANE 3: AGENTIC GOVERNANCE (NHI &amp; THREAT RESPONSE)</text>

    <g filter="url(#shadow)">
      <rect x="120" y="505" width="380" height="80" rx="8" fill="url(#glass)" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <text x="135" y="525" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#C4B5FD">Non-Human Identity (NHI) Registry</text>
      <text x="135" y="545" font-family="JetBrains Mono, monospace" font-size="10" fill="#717D96">AI Agents · Bots · Service Accounts</text>
      <text x="135" y="565" font-family="Inter, sans-serif" font-size="9" fill="#14B8A6" font-weight="600">Depth-Limited Delegation Chains</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="540" y="505" width="380" height="80" rx="8" fill="url(#glass)" stroke="#8B5CF6" stroke-opacity="0.5"/>
      <text x="555" y="525" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#C4B5FD">Blast Radius Analytics</text>
      <text x="555" y="545" font-family="JetBrains Mono, monospace" font-size="10" fill="#717D96">Neo4j Variable-Length Pathfinding</text>
      <text x="555" y="565" font-family="Inter, sans-serif" font-size="9" fill="#14B8A6" font-weight="600">"What breaks if we kill this agent?"</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="960" y="505" width="320" height="80" rx="8" fill="url(#glass)" stroke="#EF4444" stroke-opacity="0.6"/>
      <text x="975" y="525" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FCA5A5">The Kill Switch (109ms)</text>
      <text x="975" y="545" font-family="JetBrains Mono, monospace" font-size="10" fill="#717D96">Redis JTI Blocklist + Graph Cut</text>
      <text x="975" y="565" font-family="Inter, sans-serif" font-size="9" fill="#22C55E" font-weight="600">Instant NHI Termination</text>
    </g>
  </g>

  <!-- Flow Line -->
  <path d="M 700 600 L 700 640" stroke="#717D96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════════════════════════
     PLANE 4: COMPLIANCE & IMMUTABLE AUDIT (THE PROOF)
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Plane-4-Compliance">
    <rect x="60" y="640" width="1280" height="140" rx="12" fill="url(#compliance-grad)" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1"/>
    <text x="80" y="665" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="1">PLANE 4: COMPLIANCE &amp; IMMUTABLE AUDIT (SOC-2 / ISO 27001)</text>

    <g filter="url(#shadow)">
      <rect x="120" y="685" width="380" height="80" rx="8" fill="url(#glass)" stroke="#F59E0B" stroke-opacity="0.5"/>
      <text x="135" y="705" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FDE68A">Access Certifications (IGA)</text>
      <text x="135" y="725" font-family="JetBrains Mono, monospace" font-size="10" fill="#717D96">Temporal Campaign Workflows</text>
      <text x="135" y="745" font-family="Inter, sans-serif" font-size="9" fill="#22C55E" font-weight="600">Manager Review / Approve / Revoke</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="540" y="685" width="380" height="80" rx="8" fill="url(#glass)" stroke="#F59E0B" stroke-opacity="0.5"/>
      <text x="555" y="705" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FDE68A">Tamper-Proof Audit Ledger</text>
      <text x="555" y="725" font-family="JetBrains Mono, monospace" font-size="10" fill="#717D96">Cryptographically Chained Logs (SHA-256)</text>
      <text x="555" y="745" font-family="Inter, sans-serif" font-size="9" fill="#22C55E" font-weight="600">Append-Only · Zero-Trust Evidence</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="960" y="685" width="320" height="80" rx="8" fill="url(#glass)" stroke="#F59E0B" stroke-opacity="0.5"/>
      <text x="975" y="705" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FDE68A">CAEP Event Broadcast</text>
      <text x="975" y="725" font-family="JetBrains Mono, monospace" font-size="10" fill="#717D96">HMAC-Signed SET Tokens</text>
      <text x="975" y="745" font-family="Inter, sans-serif" font-size="9" fill="#22C55E" font-weight="600">Real-time Session Revocation</text>
    </g>
  </g>

  <!-- Flow Line -->
  <path d="M 700 780 L 700 820" stroke="#717D96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════════════════════════
     PLANE 5: STATE & ORCHESTRATION (THE BACKBONE)
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Plane-5-State">
    <rect x="60" y="820" width="1280" height="180" rx="12" fill="url(#data-grad)" stroke="#22C55E" stroke-opacity="0.3" stroke-width="1"/>
    <text x="80" y="845" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#22C55E" letter-spacing="1">PLANE 5: STATE &amp; ORCHESTRATION (DURABLE &amp; MULTI-TENANT)</text>

    <!-- PostgreSQL -->
    <g filter="url(#shadow)">
      <rect x="100" y="865" width="300" height="120" rx="8" fill="url(#glass)" stroke="#22C55E" stroke-opacity="0.5"/>
      <ellipse cx="130" cy="885" rx="12" ry="4" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E"/>
      <path d="M 118 885 V 915 Q 118 919 130 919 Q 142 919 142 915 V 885" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E"/>
      <ellipse cx="130" cy="885" rx="12" ry="4" fill="none" stroke="#22C55E"/>
      <text x="160" y="890" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FAFAFA">PostgreSQL 16</text>
      <text x="120" y="915" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Source of Truth · 30 Tables</text>
      <text x="120" y="940" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Outbox Pattern (Reliability)</text>
      <text x="120" y="965" font-family="JetBrains Mono, monospace" font-size="9" fill="#22C55E" font-weight="700">Strict Row Level Security (RLS)</text>
    </g>

    <!-- Neo4j -->
    <g filter="url(#shadow)">
      <rect x="440" y="865" width="300" height="120" rx="8" fill="url(#glass)" stroke="#22C55E" stroke-opacity="0.5"/>
      <circle cx="470" cy="885" r="4" fill="#22C55E" fill-opacity="0.8"/>
      <circle cx="460" cy="900" r="4" fill="#22C55E" fill-opacity="0.8"/>
      <circle cx="480" cy="910" r="4" fill="#22C55E" fill-opacity="0.8"/>
      <path d="M 470 885 L 460 900 M 470 885 L 480 910 M 460 900 L 480 910" stroke="#22C55E" stroke-width="1"/>
      <text x="500" y="890" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FAFAFA">Neo4j 5 Enterprise</text>
      <text x="460" y="915" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Graph Analytics &amp; Paths</text>
      <text x="460" y="940" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Entity Resolution (Persona Node)</text>
      <text x="460" y="965" font-family="JetBrains Mono, monospace" font-size="9" fill="#22C55E" font-weight="700">Native Vector Search (No Qdrant)</text>
    </g>

    <!-- Redis -->
    <g filter="url(#shadow)">
      <rect x="780" y="865" width="240" height="120" rx="8" fill="url(#glass)" stroke="#22C55E" stroke-opacity="0.5"/>
      <rect x="795" y="880" width="24" height="14" rx="2" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E"/>
      <rect x="798" y="877" width="18" height="14" rx="2" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E"/>
      <text x="835" y="890" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FAFAFA">Redis 7</text>
      <text x="795" y="915" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">In-Memory Cache</text>
      <text x="795" y="940" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Distributed Locks (Fence Tokens)</text>
      <text x="795" y="965" font-family="JetBrains Mono, monospace" font-size="9" fill="#22C55E" font-weight="700">JIT Token TTL &amp; JTI Blocklist</text>
    </g>

    <!-- Temporal & NATS -->
    <g filter="url(#shadow)">
      <rect x="1060" y="865" width="240" height="120" rx="8" fill="url(#glass)" stroke="#EC4899" stroke-opacity="0.5"/>
      <path d="M 1080 885 Q 1080 875 1090 875 Q 1100 875 1100 885 Q 1100 895 1090 895 Q 1080 895 1080 885 Z M 1100 885 Q 1100 875 1110 875 Q 1120 875 1120 885 Q 1120 895 1110 895 Q 1100 895 1100 885 Z" fill="none" stroke="#EC4899" stroke-width="1"/>
      <text x="1140" y="890" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FAFAFA">Temporal &amp; NATS</text>
      <text x="1075" y="915" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Durable Workflow Execution</text>
      <text x="1075" y="940" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Go-native Event Fabric (15MB)</text>
      <text x="1075" y="965" font-family="JetBrains Mono, monospace" font-size="9" fill="#22C55E" font-weight="700">Offboard · Certify · Cascade</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
     VISION & TECH STACK
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Vision-Statement">
    <rect x="60" y="1040" width="1280" height="270" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
    <text x="700" y="1075" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#93C5FD" text-anchor="middle">THE FAANG-GRADE ENTERPRISE VALUE PROPOSITION</text>
    
    <text x="100" y="1115" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">1. Unmatched Speed &amp; Resilience:</text>
    <text x="100" y="1135" font-family="Inter, sans-serif" font-size="12" fill="#717D96">A Go-native modular monolith backed by Temporal durable execution and NATS JetStream. We execute 9:00 AM terminations in 109ms, not hours. Zero data loss.</text>

    <text x="100" y="1175" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">2. AI Agentic Security (The Moat):</text>
    <text x="100" y="1195" font-family="Inter, sans-serif" font-size="12" fill="#717D96">While Okta manages humans, ObserveID secures the autonomous AI agent swarm. RS256 JIT Passports, dynamic Cedar scope-narrowing, and instant graph-edge severing.</text>

    <text x="100" y="1235" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">3. Mathematical Certainty &amp; Tamper-Proof Compliance:</text>
    <text x="100" y="1255" font-family="Inter, sans-serif" font-size="12" fill="#717D96">Cryptographically chained audit logs and graph-native Access Certifications. We don't just pass SOC-2; we provide mathematical proof of access control.</text>

    <text x="100" y="1295" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#5EEAD4" letter-spacing="1">TECH STACK: Go 1.23 · Next.js 14 · PostgreSQL 16 (RLS) · Neo4j 5 (Vectors) · Redis 7 · Temporal v1.25 · NATS · AWS Cedar</text>
  </g>
</svg>