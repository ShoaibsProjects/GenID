<svg width="1400" height="1250" viewBox="0 0 1400 1250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="1250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#0F0F13"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edge-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F38020" stop-opacity="0.1"/><stop offset="100%" stop-color="#F38020" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="api-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/><stop offset="100%" stop-color="#3B82F6" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="svc-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.1"/><stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="async-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#EC4899" stop-opacity="0.1"/><stop offset="100%" stop-color="#EC4899" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="data-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22C55E" stop-opacity="0.1"/><stop offset="100%" stop-color="#22C55E" stop-opacity="0.02"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#717D96"/></marker>
  </defs>

  <rect width="1400" height="1250" fill="url(#bg)"/>

  <!-- Header -->
  <text x="700" y="50" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#FAFAFA" text-anchor="middle">ObserveID: Master Architecture</text>
  <text x="700" y="78" font-family="Inter, sans-serif" font-size="14" fill="#717D96" text-anchor="middle">The Graph-Native, Policy-as-Code Identity Control Plane for the Agentic Era</text>
  <line x1="100" y1="100" x2="1300" y2="100" stroke="#27272A" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════════════════════════
     LAYER 1: EDGE & ENTITY PLANE
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Layer-1-Edge">
    <rect x="60" y="120" width="1280" height="120" rx="12" fill="url(#edge-grad)" stroke="#F38020" stroke-opacity="0.3" stroke-width="1"/>
    <text x="80" y="145" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#F38020" letter-spacing="1">EDGE &amp; ENTITY PLANE (THE OUTSIDE WORLD)</text>
    
    <!-- CISO UI -->
    <g filter="url(#shadow)">
      <rect x="120" y="165" width="220" height="60" rx="8" fill="url(#glass)" stroke="#F38020" stroke-opacity="0.4"/>
      <text x="135" y="185" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">CISO Dashboard</text>
      <text x="135" y="202" font-family="Inter, sans-serif" font-size="10" fill="#717D96">Next.js 14 · Cloudflare</text>
      <text x="135" y="215" font-family="Inter, sans-serif" font-size="9" fill="#22C55E">Access Reviews · Audit</text>
    </g>
    
    <!-- Human Users -->
    <g filter="url(#shadow)">
      <rect x="380" y="165" width="220" height="60" rx="8" fill="url(#glass)" stroke="#F38020" stroke-opacity="0.4"/>
      <text x="395" y="185" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">Human Workforce</text>
      <text x="395" y="202" font-family="Inter, sans-serif" font-size="10" fill="#717D96">HR Systems (Workday)</text>
      <text x="395" y="215" font-family="Inter, sans-serif" font-size="9" fill="#717D96">SCIM / CSV Inbound</text>
    </g>

    <!-- AI Agents -->
    <g filter="url(#shadow)">
      <rect x="640" y="165" width="240" height="60" rx="8" fill="url(#glass)" stroke="#F38020" stroke-opacity="0.4"/>
      <text x="655" y="185" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">Autonomous AI Agents</text>
      <text x="655" y="202" font-family="Inter, sans-serif" font-size="10" fill="#717D96">LLMs · Bots · RPA</text>
      <text x="655" y="215" font-family="Inter, sans-serif" font-size="9" fill="#14B8A6">Request JIT Passports</text>
    </g>

    <!-- Downstream Apps -->
    <g filter="url(#shadow)">
      <rect x="920" y="165" width="220" height="60" rx="8" fill="url(#glass)" stroke="#F38020" stroke-opacity="0.4"/>
      <text x="935" y="185" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">Downstream SaaS</text>
      <text x="935" y="202" font-family="Inter, sans-serif" font-size="10" fill="#717D96">AWS · Slack · GitHub</text>
      <text x="935" y="215" font-family="Inter, sans-serif" font-size="9" fill="#717D96">Receive CAEP Kill Events</text>
    </g>
  </g>

  <!-- Flow Line -->
  <path d="M 700 240 L 700 280" stroke="#717D96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════════════════════════
     LAYER 2: IDENTITY CONTROL PLANE (GO MODULAR MONOLITH)
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Layer-2-ControlPlane">
    <rect x="60" y="280" width="1280" height="160" rx="12" fill="url(#api-grad)" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="80" y="305" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#3B82F6" letter-spacing="1">IDENTITY CONTROL PLANE (GO 1.23 MODULAR MONOLITH)</text>

    <!-- API Gateway -->
    <g filter="url(#shadow)">
      <rect x="100" y="325" width="220" height="100" rx="8" fill="url(#glass)" stroke="#3B82F6" stroke-opacity="0.5"/>
      <text x="115" y="345" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">API Gateway</text>
      <text x="115" y="365" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">gorilla/mux · SCIM 2.0</text>
      <rect x="115" y="375" width="80" height="16" rx="4" fill="#22C55E" fill-opacity="0.2"/>
      <text x="155" y="386" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#4ADE80" text-anchor="middle">JWT/JWKS</text>
      <text x="115" y="405" font-family="Inter, sans-serif" font-size="9" fill="#22C55E" font-weight="600">NO X-Headers · Strict Auth</text>
    </g>

    <!-- Cedar Policy Engine -->
    <g filter="url(#shadow)">
      <rect x="360" y="325" width="220" height="100" rx="8" fill="url(#glass)" stroke="#3B82F6" stroke-opacity="0.5"/>
      <text x="375" y="345" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">Cedar Engine</text>
      <text x="375" y="365" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Policy-as-Code (Hot Reload)</text>
      <text x="375" y="385" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Contextual AuthZ</text>
      <text x="375" y="405" font-family="Inter, sans-serif" font-size="9" fill="#14B8A6" font-weight="600">Dynamic Scope Narrowing</text>
    </g>

    <!-- OIDC / JIT Mint -->
    <g filter="url(#shadow)">
      <rect x="620" y="325" width="220" height="100" rx="8" fill="url(#glass)" stroke="#3B82F6" stroke-opacity="0.5"/>
      <text x="635" y="345" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">OIDC &amp; JIT Mint</text>
      <text x="635" y="365" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">RS256 JWT Signing</text>
      <text x="635" y="385" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">5-min Ephemeral Passports</text>
      <text x="635" y="405" font-family="Inter, sans-serif" font-size="9" fill="#14B8A6" font-weight="600">Zero-Standing Privilege</text>
    </g>

    <!-- Connectors & Vault -->
    <g filter="url(#shadow)">
      <rect x="880" y="325" width="220" height="100" rx="8" fill="url(#glass)" stroke="#3B82F6" stroke-opacity="0.5"/>
      <text x="895" y="345" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">Connectors &amp; Vault</text>
      <text x="895" y="365" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Entra · LDAP · SCIM</text>
      <text x="895" y="385" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">AES-256-GCM Credential Vault</text>
      <text x="895" y="405" font-family="Inter, sans-serif" font-size="9" fill="#14B8A6" font-weight="600">Entity Resolution (Stitching)</text>
    </g>

    <!-- GraphQL & Audit -->
    <g filter="url(#shadow)">
      <rect x="1140" y="325" width="180" height="100" rx="8" fill="url(#glass)" stroke="#3B82F6" stroke-opacity="0.5"/>
      <text x="1155" y="345" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#93C5FD">GraphQL &amp; Audit</text>
      <text x="1155" y="365" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Tenant-scoped Resolvers</text>
      <text x="1155" y="385" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Immutable Audit Trail</text>
      <text x="1155" y="405" font-family="Inter, sans-serif" font-size="9" fill="#22C55E" font-weight="600">SOC-2 Ready</text>
    </g>
  </g>

  <!-- Flow Line -->
  <path d="M 700 440 L 700 480" stroke="#717D96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════════════════════════
     LAYER 3: ORCHESTRATION & EVENT PLANE (THE ASYNC CORE)
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Layer-3-Async">
    <rect x="60" y="480" width="1280" height="160" rx="12" fill="url(#async-grad)" stroke="#EC4899" stroke-opacity="0.3" stroke-width="1"/>
    <text x="80" y="505" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#EC4899" letter-spacing="1">ORCHESTRATION &amp; EVENT PLANE (DURABLE EXECUTION)</text>

    <!-- Temporal -->
    <g filter="url(#shadow)">
      <rect x="140" y="525" width="400" height="100" rx="8" fill="url(#glass)" stroke="#EC4899" stroke-opacity="0.4"/>
      <text x="155" y="545" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FDA4AF">Temporal.io Workflows</text>
      <text x="155" y="565" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">OffboardIdentity · CascadeRevoke · JIT</text>
      <text x="155" y="585" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">AccessCertificationWorkflow (SOC-2)</text>
      <text x="155" y="610" font-family="Inter, sans-serif" font-size="10" fill="#22C55E" font-weight="700">109ms 9:00 AM Termination Tested</text>
    </g>

    <!-- NATS -->
    <g filter="url(#shadow)">
      <rect x="580" y="525" width="320" height="100" rx="8" fill="url(#glass)" stroke="#EC4899" stroke-opacity="0.4"/>
      <text x="595" y="545" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FDA4AF">NATS JetStream</text>
      <text x="595" y="565" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Go-native Event Fabric (15MB RAM)</text>
      <text x="595" y="585" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Zero Kafka Bloat · $0 Dev Cost</text>
      <text x="595" y="610" font-family="Inter, sans-serif" font-size="10" fill="#22C55E" font-weight="700">PG Outbox → NATS Pub/Sub</text>
    </g>

    <!-- CAEP Broadcast -->
    <g filter="url(#shadow)">
      <rect x="940" y="525" width="380" height="100" rx="8" fill="url(#glass)" stroke="#EC4899" stroke-opacity="0.4"/>
      <text x="955" y="545" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FDA4AF">CAEP Event Broadcast</text>
      <text x="955" y="565" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">HMAC-SHA256 Signed Webhooks</text>
      <text x="955" y="585" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Instant Session Revocation (Downstream)</text>
      <text x="955" y="610" font-family="Inter, sans-serif" font-size="10" fill="#22C55E" font-weight="700">Mathematical Certainty</text>
    </g>
  </g>

  <!-- Flow Line -->
  <path d="M 700 640 L 700 680" stroke="#717D96" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════════════════════════
     LAYER 4: DATA & STATE PLANE
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Layer-4-Data">
    <rect x="60" y="680" width="1280" height="160" rx="12" fill="url(#data-grad)" stroke="#22C55E" stroke-opacity="0.3" stroke-width="1"/>
    <text x="80" y="705" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#22C55E" letter-spacing="1">DATA &amp; STATE PLANE (MULTI-TENANT RLS)</text>

    <!-- PostgreSQL -->
    <g filter="url(#shadow)">
      <rect x="140" y="725" width="340" height="100" rx="8" fill="url(#glass)" stroke="#22C55E" stroke-opacity="0.4"/>
      <ellipse cx="170" cy="745" rx="12" ry="4" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E"/>
      <path d="M 158 745 V 775 Q 158 779 170 779 Q 182 779 182 775 V 745" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E"/>
      <ellipse cx="170" cy="745" rx="12" ry="4" fill="none" stroke="#22C55E"/>
      <text x="200" y="750" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FAFAFA">PostgreSQL 16</text>
      <text x="160" y="775" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Source of Truth · 30 Tables</text>
      <text x="160" y="800" font-family="JetBrains Mono, monospace" font-size="9" fill="#22C55E" font-weight="700">Strict Row Level Security (tenant_id)</text>
    </g>

    <!-- Neo4j -->
    <g filter="url(#shadow)">
      <rect x="530" y="725" width="340" height="100" rx="8" fill="url(#glass)" stroke="#22C55E" stroke-opacity="0.4"/>
      <circle cx="560" cy="745" r="4" fill="#22C55E" fill-opacity="0.8"/>
      <circle cx="550" cy="760" r="4" fill="#22C55E" fill-opacity="0.8"/>
      <circle cx="570" cy="770" r="4" fill="#22C55E" fill-opacity="0.8"/>
      <path d="M 560 745 L 550 760 M 560 745 L 570 770 M 550 760 L 570 770" stroke="#22C55E" stroke-width="1"/>
      <text x="590" y="750" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FAFAFA">Neo4j 5 Enterprise</text>
      <text x="550" y="775" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">Graph Analytics · Blast Radius</text>
      <text x="550" y="800" font-family="JetBrains Mono, monospace" font-size="9" fill="#22C55E" font-weight="700">Native Vector Search (No Qdrant)</text>
    </g>

    <!-- Redis -->
    <g filter="url(#shadow)">
      <rect x="920" y="725" width="340" height="100" rx="8" fill="url(#glass)" stroke="#22C55E" stroke-opacity="0.4"/>
      <rect x="935" y="740" width="24" height="14" rx="2" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E"/>
      <rect x="938" y="737" width="18" height="14" rx="2" fill="#22C55E" fill-opacity="0.2" stroke="#22C55E"/>
      <text x="975" y="750" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#FAFAFA">Redis 7</text>
      <text x="935" y="775" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">In-Memory Cache · Distributed Locks</text>
      <text x="935" y="800" font-family="JetBrains Mono, monospace" font-size="9" fill="#22C55E" font-weight="700">JIT Token TTL &amp; JTI Blocklist</text>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
     LAYER 5: DEPLOYMENT & OBSERVABILITY
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Layer-5-Deploy">
    <rect x="60" y="870" width="1280" height="100" rx="12" fill="#16171E" stroke="#27272A" stroke-width="1"/>
    <text x="80" y="895" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#717D96" letter-spacing="1">DEPLOYMENT &amp; OBSERVABILITY</text>
    
    <rect x="100" y="910" width="300" height="50" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.3"/>
    <text x="115" y="930" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#93C5FD">Lean Docker Compose</text>
    <text x="115" y="948" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">NATS embedded · $0 Dev Cost</text>

    <rect x="430" y="910" width="300" height="50" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-opacity="0.3"/>
    <text x="445" y="930" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#93C5FD">Kubernetes (EKS/GKE)</text>
    <text x="445" y="948" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">3 Binaries: gateway · worker · graph</text>

    <rect x="760" y="910" width="300" height="50" rx="6" fill="#0F172A" stroke="#EAB308" stroke-opacity="0.3"/>
    <text x="775" y="930" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FDE047">OpenTelemetry + Grafana</text>
    <text x="775" y="948" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">gRPC Traces · Prometheus Metrics</text>
    
    <rect x="1090" y="910" width="220" height="50" rx="6" fill="#0F172A" stroke="#14B8A6" stroke-opacity="0.3"/>
    <text x="1105" y="930" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#5EEAD4">OWASP Top 10 Audited</text>
    <text x="1105" y="948" font-family="JetBrains Mono, monospace" font-size="9" fill="#717D96">SQLi · AuthZ · Crypto · Audit</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
     VISION STATEMENT
     ══════════════════════════════════════════════════════════════════ -->
  <g id="Vision-Statement">
    <rect x="60" y="1000" width="1280" height="200" rx="12" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
    <text x="700" y="1030" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#93C5FD" text-anchor="middle">THE ENTERPRISE VALUE PROPOSITION</text>
    
    <text x="100" y="1065" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">1. The Entry Ticket (IGA Parity):</text>
    <text x="100" y="1085" font-family="Inter, sans-serif" font-size="11" fill="#717D96">Access Certifications, Audit Logs, and SOC-2 compliance workflows that get ObserveID past enterprise procurement.</text>

    <text x="100" y="1120" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">2. The Moat (Agentic Security):</text>
    <text x="100" y="1140" font-family="Inter, sans-serif" font-size="11" fill="#717D96">5-minute JIT JWT Passports, 109ms Kill Switches, and Neo4j Graph Blast Radius for Non-Human Identities (AI Agents).</text>

    <text x="100" y="1175" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">3. The Foundation (Lean Core):</text>
    <text x="100" y="1195" font-family="Inter, sans-serif" font-size="11" fill="#717D96">A Go-native, Modular Monolith utilizing Temporal, Cedar, and NATS. FAANG-scale performance on a $0 budget.</text>
  </g>
</svg>