name: Build, Scan & Publish Docker Images
on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Scan, Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # for cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (identity-service)
        id: meta-identity
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}/identity-service
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Extract metadata (event-processor)
        id: meta-event
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}/event-processor
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}/frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build & Scan Identity Service
        id: build-identity
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/identity-service.Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-identity.outputs.tags }}
          labels: ${{ steps.meta-identity.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # attestations (provenance/sbom) are incompatible with `load: true` (docker exporter
          # cannot export manifest lists); scan-before-push gate takes priority
          provenance: false
          sbom: false

      - name: Build & Scan Event Processor
        id: build-event
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/event-processor.Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-event.outputs.tags }}
          labels: ${{ steps.meta-event.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # attestations (provenance/sbom) are incompatible with `load: true` (docker exporter
          # cannot export manifest lists); scan-before-push gate takes priority
          provenance: false
          sbom: false

      - name: Build & Scan Frontend
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # attestations (provenance/sbom) are incompatible with `load: true` (docker exporter
          # cannot export manifest lists); scan-before-push gate takes priority
          provenance: false
          sbom: false

      - name: Trivy scan — identity-service
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}/identity-service:main
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Trivy scan — event-processor
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}/event-processor:main
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}/frontend:main
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Push Identity Service
        run: printf '%s\n' "${{ steps.meta-identity.outputs.tags }}" | xargs -I{} docker push {}

      - name: Push Event Processor
        run: printf '%s\n' "${{ steps.meta-event.outputs.tags }}" | xargs -I{} docker push {}

      - name: Push Frontend
        run: printf '%s\n' "${{ steps.meta-frontend.outputs.tags }}" | xargs -I{} docker push {}

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.4"

      - name: Sign images with cosign (keyless)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for tag in ${{ steps.meta-identity.outputs.tags }} ${{ steps.meta-event.outputs.tags }} ${{ steps.meta-frontend.outputs.tags }}; do
            cosign sign --yes "$tag"
          done