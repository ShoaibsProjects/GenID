name: CI — Build, Lint, Test & Security Gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # ─── Secret Scanning ───────────────────────────────────
  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─── Go Backend ────────────────────────────────────────
  backend:
    name: Go Backend (vet, test, vuln scan)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: observeid
          POSTGRES_USER: observeid
          POSTGRES_PASSWORD: observeid
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U observeid"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/observeid123
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: cd backend && go vet ./...

      - name: Build
        run: cd backend && go build ./...

      - name: Test (race)
        run: cd backend && go test -v -race -count=1 ./...
        env:
          DATABASE_URL: postgresql://observeid:observeid@localhost:5432/genid?sslmode=disable
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: observeid123

      - name: Vulnerability scan (govulncheck)
        run: |
          cd backend
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # ─── Next.js Frontend ─────────────────────────────────
  frontend:
    name: Next.js Frontend (lint, test, audit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  # ─── Deliverables ─────────────────────────────────────
  deliverables:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [secrets, backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Summarize
        run: |
          echo "## ✅ CI + Security Gates Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Secrets:** gitleaks scan clean" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend:** Go vet, build, race tests, govulncheck passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** npm audit, lint, tests, Next.js build passed" >> $GITHUB_STEP_SUMMARY