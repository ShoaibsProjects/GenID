# version removed - obsolete

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  genid-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  neo4j-data:
  temporal-db:
  redis-data:
  nats-data:

services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: genid-postgres
    environment:
      POSTGRES_DB: observeid
      POSTGRES_USER: observeid
      POSTGRES_PASSWORD: observeid
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - genid-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observeid"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  # ─── Neo4j ─────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: genid-neo4j
    environment:
      NEO4J_AUTH: neo4j/observeid123
      NEO4J_dbms_memory_pagecache_size: "512M"
      NEO4J_dbms_memory_heap_initial__size: "512M"
      NEO4J_dbms_memory_heap_max__size: "1G"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j-data:/data
      - ./neo4j/init.cypher:/init.cypher
    networks:
      - genid-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-verbose -O- http://localhost:7474 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
    logging: *default-logging

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: genid-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - genid-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # ─── NATS JetStream ────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: genid-nats
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - genid-net
    healthcheck:
      test: ["CMD", "nats-server", "--signal", "ldm=nats"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ─── Temporal Server ───────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.25
    container_name: genid-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: observeid
      POSTGRES_PWD: observeid
      POSTGRES_DB: observeid
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamic.yaml
      LOG_LEVEL: "info"
    ports:
      - "7233:7233"  # gRPC
      - "8233:8233"  # Web UI
    volumes:
      - ./temporal/config.yaml:/etc/temporal/config/dynamic.yaml
    networks:
      - genid-net
    healthcheck:
      test: ["CMD", "pidof", "temporal-server"]
      interval: 15s
      timeout: 10s
      retries: 10
    logging: *default-logging

  temporal-admin:
    image: temporalio/admin-tools:1.25
    container_name: genid-temporal-admin
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    entrypoint: |
      sh -c "
      echo 'Waiting for Temporal...';
      sleep 10;
      temporal --address temporal:7233 operator namespace create --namespace critical-offboarding --description 'Critical offboarding workflows' --retention 720h || true;
      temporal --address temporal:7233 operator namespace create --namespace provisioning --description 'Standard provisioning' --retention 336h || true;
      temporal --address temporal:7233 operator namespace create --namespace reconciliation --description 'Reconciliation workflows' --retention 168h || true;
      temporal --address temporal:7233 operator namespace create --namespace analysis --description 'Analysis and cron workflows' --retention 168h || true;
      echo 'Namespaces created.';
      tail -f /dev/null
      "
    networks:
      - genid-net
    logging: *default-logging

  # ─── OpenTelemetry Collector ───────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: genid-otel
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    networks:
      - genid-net
    logging: *default-logging

  # ─── Temporal Web UI ───────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:latest
    container_name: genid-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_GRPC_ENDPOINT: temporal:7233
    ports:
      - "8234:8080"
    networks:
      - genid-net
    logging: *default-logging

  # ─── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: genid-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: observeid123
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3000:3000"
    volumes:
      - ../grafana:/etc/grafana/provisioning
    networks:
      - genid-net
    logging: *default-logging

  # ─── Identity Service (Go) ─────────────────────────────────
  # Build context is the repo root (one level up from infrastructure/).
  # For local dev you can still use `make backend` instead.
  identity-service:
    build:
      context: ..
      dockerfile: docker/identity-service.Dockerfile
    container_name: genid-identity-service
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      temporal:
        condition: service_healthy
      temporal-admin:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://observeid:observeid@postgres:5432/genid?sslmode=disable
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: observeid123
      REDIS_ADDR: redis:6379
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: critical-offboarding
      NATS_URL: nats://nats:4222
      JWKS_URL: http://localhost:8080/.well-known/jwks.json
      API_KEYS: admin-key:admin-secret-key-please-change
      MASTER_KEY: dev-only-master-key-32-bytes-long-x
      JWT_SIGNING_KEY: dev-only-hs256-signing-key-replaced-by-rsa
      DEV_LOGIN_ENABLED: "true"
    ports:
      - "8080:8080"
    networks:
      - genid-net
    logging: *default-logging
    restart: unless-stopped

  # ─── Frontend (Next.js static export via nginx) ────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: genid-frontend
    depends_on:
      - identity-service
    ports:
      - "3001:3000"
    networks:
      - genid-net
    logging: *default-logging
    restart: unless-stopped
