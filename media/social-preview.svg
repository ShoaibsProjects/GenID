    <text x="650" y="252" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700" fill="#4ADE80">~38<tspan font-size="20">K</tspan></text>
    <text x="650" y="288" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#A1A1AA">LOC · Go + TS</text>
    <text x="650" y="306" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52525B">31K Go · 7.2K TS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="220" width="200" height="100" rx="12" fill="#0F1320" stroke="#EC4899" stroke-opacity="0.3" stroke-width="1"/>
    <text x="870" y="252" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700" fill="#F472B6">98<tspan font-size="20">+</tspan></text>
    <text x="870" y="288" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#A1A1AA">FAANG-driven commits</text>
    <text x="870" y="306" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52525B">6 sprints · 12-layer audit</text>
  </g>

