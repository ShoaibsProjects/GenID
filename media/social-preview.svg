      <path d="M22 20 v 8 M18 24 h 8" stroke="#3B82F6" stroke-width="2"/>
      <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">AWS Cedar</text>
      <text x="140" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717D96">policy-as-code</text>
