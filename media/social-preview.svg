  <text x="80" y="625" font-family="'JetBrains Mono', monospace" font-size="12" fill="#52525B">github.com/ShoaibsProjects/GenID</text>
  <text x="1200" y="625" font-family="'JetBrains Mono', monospace" font-size="12" fill="#52525B" text-anchor="end">Go 1.25 · Next.js 14 · Postgres · Neo4j · Cedar · v1.0.0</text>
