      <path d="M14 24 h 16 M22 16 v 16" stroke="#8B5CF6" stroke-width="2"/>
      <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">GraphRAG</text>
      <text x="140" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717D96">AI copilot · Neo4j</text>
    </g>

    <g transform="translate(600, 24)">
      <rect width="290" height="48" rx="8" fill="#0F1320" stroke="#14B8A6" stroke-opacity="0.25"/>
      <circle cx="22" cy="24" r="8" fill="#14B8A6" fill-opacity="0.18"/>
      <path d="M18 24 l 3 3 l 6 -6" stroke="#14B8A6" stroke-width="2" fill="none"/>
      <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">NHI governance</text>
      <text x="160" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717D96">5-min JIT JWTs</text>
    </g>

    <g transform="translate(0, 84)">
      <rect width="280" height="48" rx="8" fill="#0F1320" stroke="#22C55E" stroke-opacity="0.25"/>
      <circle cx="22" cy="24" r="8" fill="#22C55E" fill-opacity="0.18"/>
      <path d="M14 24 h 16 M18 20 l 8 8" stroke="#22C55E" stroke-width="2" fill="none"/>
      <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">Temporal</text>
      <text x="140" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717D96">11 workflows</text>
    </g>

    <g transform="translate(300, 84)">
      <rect width="280" height="48" rx="8" fill="#0F1320" stroke="#EC4899" stroke-opacity="0.25"/>
      <circle cx="22" cy="24" r="8" fill="#EC4899" fill-opacity="0.18"/>
      <path d="M16 28 l 4 -8 l 4 4 l 4 -10" stroke="#EC4899" stroke-width="2" fill="none"/>
      <text x="42" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">NATS JetStream</text>
      <text x="160" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#717D96">event-driven core</text>
    </g>

    <g transform="translate(600, 84)">
      <rect width="290" height="48" rx="8" fill="#0F1320" stroke="#EF4444" stroke-opacity="0.25"/>
      <circle cx="22" cy="24" r="8" fill="#EF4444" fill-opacity="0.18"/>
      <path d="M22 16 a 8 8 0 1 0 0 16 a 8 8 0 1 0 0 -16 M22 20 v 4 l 3 3" stroke="#EF4444" stroke-width="1.5" fill="none"/>
