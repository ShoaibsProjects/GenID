<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0A0D17"/>
      <stop offset="100%" stop-color="#05070D"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="25%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#3B82F6" flood-opacity="0.25"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <g opacity="0.04">
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="640" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#3B82F6" stroke-width="0.5"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="#3B82F6" stroke-width="0.5"/>
  </g>

  <!-- Top accent -->
  <rect x="0" y="0" width="1280" height="2" fill="url(#divider)"/>

  <!-- Logo glyph -->
  <g filter="url(#shadow)">
    <rect x="80" y="70" width="80" height="80" rx="20" fill="#0A0D17" stroke="url(#brandGrad)" stroke-width="2"/>
    <path d="M100 96 L120 116 L100 136 M124 116 L140 116" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M100 96 L84 116 L100 136" stroke="#6366F1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
  </g>

  <!-- Title -->
  <text x="190" y="105" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="56" font-weight="800" fill="#FAFAFA" letter-spacing="-1.2">GenID</text>
  <text x="190" y="142" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="600" fill="#A1A1AA">The Agentic Identity Fabric</text>

  <!-- Tagline -->
