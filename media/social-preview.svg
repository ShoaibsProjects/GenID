  <g transform="translate(190, 380)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#717D96" letter-spacing="1">ENGINEERED FOR THE AGENT ERA</text>

    <g transform="translate(0, 24)">
