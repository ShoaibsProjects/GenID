    <rect x="190" y="220" width="200" height="100" rx="12" fill="#0F1320" stroke="#3B82F6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="210" y="252" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700" fill="#60A5FA">109<tspan font-size="20">ms</tspan></text>
    <text x="210" y="288" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#A1A1AA">Identity kill switch</text>
    <text x="210" y="306" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52525B">Temporal + Redis JTI</text>
  </g>

