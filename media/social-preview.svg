    <text x="430" y="252" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="700" fill="#A78BFA">28<tspan font-size="20"> tb</tspan></text>
    <text x="430" y="288" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#A1A1AA">RLS multi-tenancy</text>
    <text x="430" y="306" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52525B">56 policies · Postgres</text>
  </g>

